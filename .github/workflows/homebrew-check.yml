name: Homebrew formula check

# Catches a Homebrew formula that silently stops following releases (e.g. the release
# workflow hung or was cancelled), and a published formula that no longer installs.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/homebrew-check.yml

env:
  # how long after a release the formula may still point at the previous one
  GRACE_HOURS: '3'

jobs:
  formula-matches-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the formula version with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          PUBLISHED=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .published_at)
          FORMULA_TAG=$(gh api repos/robusta-dev/homebrew-krr/contents/Formula/krr.rb --jq .content \
            | base64 --decode | grep -o 'releases/download/[^/]*' | head -1 | cut -d/ -f3)
          echo "latest release: $LATEST (published $PUBLISHED)"
          echo "formula:        $FORMULA_TAG"
          if [ "$LATEST" = "$FORMULA_TAG" ]; then
            echo "Formula is up to date."
            exit 0
          fi
          AGE_HOURS=$(( ( $(date +%s) - $(date -d "$PUBLISHED" +%s) ) / 3600 ))
          MSG="Homebrew formula points at $FORMULA_TAG but the latest release is $LATEST (published ${AGE_HOURS}h ago). Check the 'Build and Release' run for $LATEST."
          if [ "$AGE_HOURS" -lt "$GRACE_HOURS" ]; then
            echo "::notice::$MSG Still within the ${GRACE_HOURS}h grace period."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # report, but don't block PRs that only change this workflow
            echo "::warning::$MSG"
          else
            echo "::error::$MSG"
            exit 1
          fi

  brew-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Put brew on PATH (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install krr from the published tap
        run: brew install robusta-dev/krr/krr
      - name: Check the installed krr
        run: |
          brew test robusta-dev/krr/krr
          krr version
